{% extends 'layout.html' %}

{% from "govuk/components/button/macro.njk" import govukButton %}

{% set pageTitle = form.title %}

{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <span class="govuk-caption-l">{{ tR('signIn.homepage.caption') }}</span>
      <h1 class="govuk-heading-l">{{ form.title }}</h1>

      {{ govukButton({
        text: tR('signIn.homepage.startButton'),
        href: startUrl
      }) }}
    </div>
  </div>
{% endblock %}
